<!DOCTYPE html>
<html>
<head>
    <title>ATM System</title>
    <style>
        body {
            font-family: Arial;
            background: #eee;
            text-align: center;
        }

        .atm {
            width: 350px;
            margin: 50px auto;
            padding: 25px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        .screen {
            background: #222;
            color: white;
            padding: 20px;
            margin-bottom: 20px;
        }

        button {
            width: 140px;
            padding: 10px;
            margin: 5px;
        }
    </style>
</head>

<body>

<div class="atm">
    <h2>ATM SYSTEM</h2>

    <div class="screen">
        Welcome to ATM<br>
        Please select an option
    </div>

    <button>Cash Withdrawal</button>
    <button>Balance Inquiry</button>
    <button>Cash Deposit</button>
    <button>Fund Transfer</button>
    <button>Mini Statement</button>
    <button>PIN Change</button>
    <button>Cancel</button>
    <button>Exit</button>
</div>

</body>
</html>
